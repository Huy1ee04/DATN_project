# ClickHouse Cluster 2 Shard × 2 Replica (4 node + 1 Keeper)
#
# Dựng:   docker compose -f clickhouse_single/docker-compose.yml up -d
# Dừng:   docker compose -f clickhouse_single/docker-compose.yml down
#
# Topology:
#   Shard 1: ch-s1r1 (replica 1) + ch-s1r2 (replica 2)
#   Shard 2: ch-s2r1 (replica 1) + ch-s2r2 (replica 2)
#   Keeper:  ch-keeper (Raft consensus)
#
# Cổng (host):
#   ch-s1r1 → HTTP: 8125, Native: 9002
#   ch-s1r2 → HTTP: 8126, Native: 9003
#   ch-s2r1 → HTTP: 8127, Native: 9004
#   ch-s2r2 → HTTP: 8128, Native: 9005
#   Keeper  → 9182

services:
  ch-keeper:
    image: clickhouse/clickhouse-keeper:latest-alpine
    container_name: ch-cluster-keeper
    hostname: ch-keeper
    volumes:
      - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    ports:
      - "9182:9181"
    networks:
      - ch-cluster-net

  # ── Shard 1, Replica 1 ──
  ch-s1r1:
    image: clickhouse/clickhouse-server:latest
    container_name: ch-cluster-s1r1
    hostname: ch-s1r1
    depends_on:
      - ch-keeper
    volumes:
      - ch_s1r1_data:/var/lib/clickhouse
      - ./config/nodes/s1r1.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./init/01_stock_data_init.sql:/docker-entrypoint-initdb.d/01_stock_data_init.sql:ro
    ports:
      - "8125:8123"
      - "9002:9000"
    networks:
      - ch-cluster-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Shard 1, Replica 2 ──
  ch-s1r2:
    image: clickhouse/clickhouse-server:latest
    container_name: ch-cluster-s1r2
    hostname: ch-s1r2
    depends_on:
      - ch-keeper
    volumes:
      - ch_s1r2_data:/var/lib/clickhouse
      - ./config/nodes/s1r2.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ports:
      - "8126:8123"
      - "9003:9000"
    networks:
      - ch-cluster-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Shard 2, Replica 1 ──
  ch-s2r1:
    image: clickhouse/clickhouse-server:latest
    container_name: ch-cluster-s2r1
    hostname: ch-s2r1
    depends_on:
      - ch-keeper
    volumes:
      - ch_s2r1_data:/var/lib/clickhouse
      - ./config/nodes/s2r1.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ports:
      - "8127:8123"
      - "9004:9000"
    networks:
      - ch-cluster-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Shard 2, Replica 2 ──
  ch-s2r2:
    image: clickhouse/clickhouse-server:latest
    container_name: ch-cluster-s2r2
    hostname: ch-s2r2
    depends_on:
      - ch-keeper
    volumes:
      - ch_s2r2_data:/var/lib/clickhouse
      - ./config/nodes/s2r2.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ports:
      - "8128:8123"
      - "9005:9000"
    networks:
      - ch-cluster-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ch_s1r1_data:
  ch_s1r2_data:
  ch_s2r1_data:
  ch_s2r2_data:

networks:
  ch-cluster-net:
    driver: bridge
