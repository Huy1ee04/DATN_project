# DATN — một file compose cho toàn dự án
#
# Cơ sở (ClickHouse 1 shard × 2 replica + Keeper, MinIO):
#   docker compose up -d
#
# Thêm pipeline streaming VWAP (ZooKeeper + Kafka + Kafka UI):
#   docker compose --profile vwap up -d
#
# Cổng (host):
#   ClickHouse HTTP: 8123 (node-01), 8124 (node-02) | Native: 9000, 9001
#   Keeper: 9181 | MinIO S3: 9100 | MinIO Console: 9101
#   Airflow Webserver: 8083
#   Kafka (profile vwap): 9092 | ZooKeeper: 2182 | Kafka UI: 8080
#   Backend (profile web): 8001 | Frontend (profile web): 3001
#   ↑ Local dev dùng 8000/3000 — container dùng 8001/3001 để tránh xung đột
#
# VWAP: schema ClickHouse (`vwap` DB, Kafka Engine) được mount vào clickhouse-01
# (chạy lần đầu khi volume trống). MinIO dùng chung instance ở trên — xem vwap_system/.env.example
#
# Dữ liệu persistent dùng named volumes do Docker quản lý.

x-airflow-common: &airflow-common
  # Dùng stock image — không cần build custom.
  # vnstock_data nằm trong Docker volume vnstock-venv, mount vào /opt/vnstock-venv.
  # Chạy `docker compose run --rm vnstock-setup` 1 lần trước khi up Airflow.
  image: apache/airflow:2.9.2-python3.10
  networks:
    - datn-project-net
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: "mysecretkey123"
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ""
    PYTHONPATH: /opt/airflow/packages
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
    - ./.env:/opt/airflow/.env
    # venv chứa vnstock_data (read-only) — tạo bởi vnstock-setup
    - vnstock-venv:/opt/vnstock-venv:ro
    # home dir của vnii — cần ghi được để vnii tạo/đọc device id, license cache
    - vnstock-home:/opt/vnstock-home
    # Scripts ingestion/transform — BashOperator gọi /opt/vnstock-venv/bin/python
    - ./ingestion/market:/opt/airflow/scripts/market_ingestion:ro
    - ./ingestion/reference:/opt/airflow/scripts/reference_ingestion:ro
    - ./transformed:/opt/airflow/scripts/transformed:ro
    - ./master:/opt/airflow/scripts/master:ro
    - ./vtit_gx:/opt/airflow/packages/vtit_gx:ro
    - ./clickhouse_student/loader:/opt/airflow/scripts/ch_loader:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:latest-alpine
    user: "101:101"
    container_name: clickhouse-student-keeper
    hostname: clickhouse-keeper
    volumes:
      - ${CONFIG_ROOT:-./clickhouse_student}/fs/volumes/clickhouse-keeper/etc/clickhouse-keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    ports:
      - "9181:9181"
    networks:
      - datn-project-net

  clickhouse-01:
    image: clickhouse/clickhouse-server:latest
    user: "101:101"
    container_name: clickhouse-student-01
    hostname: clickhouse-01
    depends_on:
      - clickhouse-keeper
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    volumes:
      - ${CONFIG_ROOT:-./clickhouse_student}/fs/volumes/clickhouse-01/etc/clickhouse-server/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - clickhouse_01_data:/var/lib/clickhouse
      # VWAP: chỉ node-01 (Kafka consumer — tránh ăn trùng message trên replica)
      - ./vwap_system/clickhouse/init.sql:/docker-entrypoint-initdb.d/02_vwap_init.sql:ro
      # Master warehouse trên MinIO (dim/fact)
      - ./clickhouse_student/init/03_stock_data_init.sql:/docker-entrypoint-initdb.d/03_stock_data_init.sql:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - datn-project-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "default", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-02:
    image: clickhouse/clickhouse-server:latest
    user: "101:101"
    container_name: clickhouse-student-02
    hostname: clickhouse-02
    depends_on:
      - clickhouse-keeper
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    volumes:
      - ${CONFIG_ROOT:-./clickhouse_student}/fs/volumes/clickhouse-02/etc/clickhouse-server/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - clickhouse_02_data:/var/lib/clickhouse
    ports:
      - "8124:8123"
      - "9001:9000"
    networks:
      - datn-project-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "default", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: datn-project-minio
    hostname: minio
    ports:
      - "9100:9100"
      - "9101:9101"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio_access_key
      MINIO_ROOT_PASSWORD: minio_secret_key
      MINIO_SERVER_URL: http://localhost:9100
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9101
      MINIO_BROWSER_CONTENT_SECURITY_POLICY: "default-src 'self' 'unsafe-eval' 'unsafe-inline'; script-src 'self' https://unpkg.com; connect-src 'self' https://unpkg.com https://dl.min.io"
    command: server --address ":9100" --console-address ":9101" /data
    networks:
      - datn-project-net

  # --- Dashboard (FastAPI + Next.js) ---
  # Profile 'web': chạy khi deploy hoặc khi không dùng local dev server.
  # Local dev dùng port 8000/3000, containers dùng 8001/3001.
  backend:
    profiles: [web]
    build: ./backend
    container_name: datn-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/code/app
    environment:
      CLICKHOUSE_HOST: clickhouse-01
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DATABASE: stock_data
    ports:
      - "8001:8000"
    networks:
      - datn-project-net
    depends_on:
      clickhouse-01:
        condition: service_healthy

  frontend:
    profiles: [web]
    build: ./frontend
    container_name: datn-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    ports:
      - "3001:3000"
    networks:
      - datn-project-net
    depends_on:
      - backend

  # --- VWAP streaming (bật: docker compose --profile vwap up -d) ---
  vwap-zookeeper:
    profiles: [vwap]
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: datn-vwap-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    networks:
      - datn-project-net

  vwap-kafka:
    profiles: [vwap]
    image: confluentinc/cp-kafka:7.5.0
    container_name: datn-vwap-kafka
    hostname: kafka
    depends_on:
      - vwap-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: vwap-zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - datn-project-net

  vwap-kafka-ui:
    profiles: [vwap]
    image: provectuslabs/kafka-ui:latest
    container_name: datn-vwap-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: datn-vwap
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: vwap-zookeeper:2181
    depends_on:
      - vwap-kafka
      - vwap-zookeeper
    networks:
      - datn-project-net

  # --- vnstock venv setup (chạy 1 lần trước khi up Airflow) ---
  # Lệnh: docker compose run --rm vnstock-setup
  # Tạo /opt/vnstock-venv trong Docker volume, cài vnstock_data qua CLI installer.
  # Nếu volume đã tồn tại → vẫn đồng bộ dependency từ airflow/requirements.txt.
  # vtit_gx không pip-install: mount + PYTHONPATH=/opt/airflow/packages trên Airflow.
  # Để cài lại từ đầu: docker volume rm <project>_vnstock-venv
  vnstock-setup:
    profiles: [setup]
    image: apache/airflow:2.9.2-python3.10
    user: root
    container_name: datn-vnstock-setup
    environment:
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY}
    volumes:
      - vnstock-venv:/opt/vnstock-venv
      - vnstock-home:/opt/vnstock-home
      - ./airflow/requirements.txt:/tmp/requirements.txt:ro
    command: >
      bash -c "
        sync_deps() {
          /opt/vnstock-venv/bin/pip install --no-cache-dir --ignore-installed -r /tmp/requirements.txt;
        }
        if [ -f /opt/vnstock-venv/bin/python ]; then
          echo 'venv da ton tai tai /opt/vnstock-venv — dong bo dependency...';
          sync_deps;
          echo 'Dong bo dependency xong.';
        else
          python3 -m venv /opt/vnstock-venv &&
          sync_deps &&
          curl -fsSL https://vnstocks.com/files/vnstock-cli-installer.run -o /tmp/installer.run &&
          chmod +x /tmp/installer.run &&
          . /opt/vnstock-venv/bin/activate &&
          HOME=/opt/vnstock-home /tmp/installer.run -- --non-interactive --api-key \"$$VNSTOCK_API_KEY\" --venv-path /opt/vnstock-venv --language en &&
          sync_deps &&
          chmod -R 755 /opt/vnstock-venv &&
          chmod -R 755 /opt/vnstock-home &&
          echo 'Setup hoan tat! Co the chay: docker compose up -d';
        fi
      "
    networks:
      - datn-project-net

  # --- Airflow ---
  postgres:
    image: postgres:13
    container_name: datn-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - datn-project-net
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: datn-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - >
        mkdir -p /sources/logs /sources/dags /sources/plugins &&
        chown -R "$${AIRFLOW_UID:-50000}:0" /sources/logs /sources/dags /sources/plugins &&
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-./airflow}:/sources
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: datn-airflow-scheduler
    command: airflow scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: datn-airflow-webserver
    command: airflow webserver
    restart: always
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  clickhouse_01_data:
  clickhouse_02_data:
  minio_storage:
  postgres-db-volume:
  # venv chứa vnstock_data — tạo bởi `docker compose run --rm vnstock-setup`
  vnstock-venv:
  # home dir của vnii (device id, license cache) — ghi được, dùng chung setup + Airflow
  vnstock-home:

networks:
  datn-project-net:
    driver: bridge
